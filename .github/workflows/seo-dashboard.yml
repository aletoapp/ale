name: SEO Health Dashboard

on:
  schedule:
    - cron: '0 6 * * *'   # todo dia às 06:00 UTC (~03:00 em Brasília)
  push:
    branches: [ main ]     # roda a cada push, pra travar link quebrado antes do ar
  workflow_dispatch: {}    # permite rodar manualmente pelo botão "Run workflow" no GitHub

permissions:
  contents: write   # necessário pro workflow poder commitar os relatórios de volta

jobs:
  seo-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências Python
        run: pip install -r scripts/requirements.txt

      # ── 1. Auditoria de title/meta/canonical/JSON-LD/canibalização ──
      - name: Auditoria de SEO (cabeçalhos)
        run: python scripts/seo_health_check.py . --out seo-health-report.md

      # ── 2. Links quebrados — falha o workflow de propósito se achar algo ──
      - name: Validar links quebrados
        run: node scripts/validate-links.js . https://alexandretorres.com.br --out link-check-report.json

      # ── 3. Métricas reais do GA4 + Search Console ──
      - name: Buscar métricas do GA4 e Search Console
        if: always()   # roda mesmo se a validação de link acima tiver falhado
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: python scripts/fetch_seo_data.py --out dashboard-data.json

      # ── 4. Salva tudo de volta no repositório ──
      - name: Commitar relatórios atualizados
        if: always()
        run: |
          git config user.name "seo-bot"
          git config user.email "seo-bot@users.noreply.github.com"
          git add seo-health-report.md link-check-report.json dashboard-data.json
          git diff --quiet --cached || git commit -m "chore: atualiza relatórios de SEO [skip ci]"
          git push
